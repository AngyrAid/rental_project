<!DOCTYPE html>
<html>
<head>
    <title>Прокат</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Каталог оборудования</h1>
    <div class="row">
        {% for item in equipment %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text">{{ item.category.name }} | {{ item.price_per_day }} ₽/сутки</p>
                    <p class="card-text"><small>Доступно: {{ item.quantity }} ед.</small></p>
                    <a href="{% url 'book_equipment' item.id %}" class="btn btn-primary">Забронировать</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p>Пока нет доступного оборудования.</p>
        {% endfor %}
    </div>
</div>
</body>
</html>
